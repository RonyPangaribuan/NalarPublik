<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Pola Titik Rapat Abu-abu (Kecamatan Sekitar) - Jelas Lembut & Terdefinisi -->
    <pattern id="dots-grey" width="5.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-2) skewX(14)">
      <ellipse cx="2.6" cy="2.1" rx="1.5" ry="1.2" fill="#64748b" fill-opacity="0.65" />
    </pattern>

    <!-- Pola Titik Hijau / Selaras (Balige) -->
    <pattern id="dots-emerald" width="5.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-2) skewX(14)">
      <ellipse cx="2.6" cy="2.1" rx="1.6" ry="1.3" fill="#10b981" />
    </pattern>

    <!-- Pola Titik Amber / Waspada (Porsea & Laguboti) -->
    <pattern id="dots-amber" width="5.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-2) skewX(14)">
      <ellipse cx="2.6" cy="2.1" rx="1.6" ry="1.3" fill="#f59e0b" />
    </pattern>

    <!-- Pola Titik Rose / Kritis (Habinsaran) -->
    <pattern id="dots-rose" width="5.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-2) skewX(14)">
      <ellipse cx="2.6" cy="2.1" rx="1.6" ry="1.3" fill="#f43f5e" />
    </pattern>

    <style>
      .region {
        fill: url(#dots-grey);
        stroke: #64748b;
        stroke-width: 0.75;
        stroke-opacity: 0.42;
      }
      .region-selaras {
        fill: url(#dots-emerald);
        stroke: #10b981;
        stroke-width: 0.8;
      }
      .region-waspada {
        fill: url(#dots-amber);
        stroke: #f59e0b;
        stroke-width: 0.8;
      }
      .region-kritis {
        fill: url(#dots-rose);
        stroke: #f43f5e;
        stroke-width: 0.8;
      }
    </style>
  </defs>

  <!-- ==================== WILAYAH KECAMATAN (TITIK RAPAT ABU-ABU) ==================== -->
  <g id="kecamatan-dotted">
    <!-- Ajibata -->
    <path id="ajibata" class="region" d="M 178,28 L 184,38 L 205,55 L 206,72 L 224,92 L 234,92 L 228,118 L 218,136 L 215,134 L 192,124 L 176,108 L 178,86 L 165,68 L 168,48 L 184,32 Z" />

    <!-- Lumban Julu -->
    <path id="lumban-julu" class="region" d="M 234,92 L 255,86 L 288,65 L 305,88 L 318,92 L 315,118 L 308,148 L 298,172 L 288,192 L 265,178 L 248,154 L 232,152 L 218,136 L 228,118 Z" />

    <!-- Bonatua Lunasi -->
    <path id="bonatua-lunasi" class="region" d="M 315,118 L 348,128 L 362,134 L 396,134 L 406,160 L 418,164 L 402,175 L 375,182 L 372,198 L 358,205 L 325,192 L 298,172 L 308,148 Z" />

    <!-- Uluan -->
    <path id="uluan" class="region" d="M 298,172 L 308,198 L 332,218 L 352,248 L 325,268 L 305,282 L 280,286 L 288,275 L 285,255 L 296,228 L 288,212 L 288,192 Z" />

