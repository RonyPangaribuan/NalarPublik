    <path id="parmaksian" class="region" d="M 372,198 L 375,182 L 402,175 L 418,164 L 442,175 L 445,192 L 425,212 L 392,225 L 385,205 Z" />

    <!-- Siantar Narumonda -->
    <path id="siantar-narumonda" class="region" d="M 445,192 L 465,192 L 488,212 L 458,232 L 435,245 L 415,245 L 392,238 L 392,225 L 425,212 Z" />

    <!-- Pintu Pohan Meranti -->
    <path id="pintu-pohan-meranti" class="region" d="M 418,164 L 436,164 L 442,175 L 458,152 L 490,150 L 512,138 L 546,146 L 576,145 L 596,124 L 618,108 L 624,122 L 638,118 L 648,102 L 656,106 L 654,125 L 642,140 L 658,150 L 646,185 L 632,212 L 605,202 L 575,202 L 548,205 L 522,182 L 515,202 L 488,212 L 465,192 L 445,192 L 442,175 Z" />

    <!-- Silaen -->
    <path id="silaen" class="region" d="M 488,212 L 515,202 L 522,182 L 548,205 L 575,202 L 552,252 L 538,272 L 485,268 L 458,288 L 455,332 L 432,345 L 432,332 L 412,305 L 425,288 L 418,265 L 435,245 L 458,232 Z" />

    <!-- Sigumpar -->
    <path id="sigumpar" class="region" d="M 378,248 L 392,238 L 415,245 L 435,245 L 418,265 L 425,288 L 412,305 L 375,285 L 382,265 Z" />

    <!-- Tampahan -->
    <path id="tampahan" class="region" d="M 234,345 L 245,342 L 258,328 L 272,352 L 262,382 L 258,408 L 246,408 L 242,375 Z" />

    <!-- Nassau -->
    <path id="nassau" class="region" d="M 658,255 L 668,255 L 696,282 L 706,258 L 702,235 L 708,224 L 716,230 L 714,275 L 722,315 L 745,338 L 768,342 L 770,355 L 750,362 L 735,360 L 742,392 L 724,418 L 685,425 L 652,438 L 618,446 L 595,432 L 578,385 L 592,355 L 615,332 L 598,302 L 622,288 Z" />

    <!-- Borbor -->
    <path id="borbor" class="region" d="M 432,360 L 478,375 L 528,395 L 562,408 L 568,432 L 595,432 L 618,446 L 622,458 L 606,478 L 582,492 L 552,515 L 512,532 L 485,522 L 462,502 L 438,492 L 435,455 L 412,432 L 395,418 L 372,405 L 395,392 Z" />
  </g>

  <!-- ==================== 4 WILAYAH SOROTAN (KONDISI WARNA RIIL) ==================== -->
  <g id="kecamatan-highlight">
    <!-- 1. Balige (Selaras / Surplus - Hijau Emerald) -->
    <path id="balige" class="region-selaras" d="M 258,328 L 272,315 L 288,325 L 298,338 L 318,328 L 336,306 L 352,345 L 368,368 L 372,405 L 355,408 L 330,395 L 302,406 L 285,395 L 265,408 L 258,408 L 262,382 L 272,352 Z" />

    <!-- 2. Porsea (Waspada - Amber / Oranye) -->
    <path id="porsea" class="region-waspada" d="M 298,172 L 325,192 L 358,205 L 372,198 L 385,205 L 392,225 L 392,238 L 378,248 L 352,248 L 332,218 L 308,198 Z" />

    <!-- 3. Laguboti (Waspada - Amber / Oranye) -->
    <path id="laguboti" class="region-waspada" d="M 375,285 L 412,305 L 432,332 L 432,360 L 395,392 L 372,405 L 368,368 L 352,345 L 336,306 L 362,298 Z" />

    <!-- 4. Habinsaran (Kritis / Defisit Tinggi - Merah Rose) -->
    <path id="habinsaran" class="region-kritis" d="M 575,202 L 605,202 L 632,212 L 648,232 L 658,255 L 622,288 L 598,302 L 615,332 L 592,355 L 578,385 L 595,432 L 568,432 L 562,408 L 528,395 L 478,375 L 432,360 L 432,345 L 455,332 L 458,288 L 485,268 L 538,272 L 552,252 Z" />
  </g>
</svg>
